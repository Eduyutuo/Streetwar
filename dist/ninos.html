<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Niños — RITMO</title>
    <link rel="stylesheet" href="css/catalog.css?v=responsive-v4" />

    <div id="site-header"></div>
    <main>
      <section class="page-hero">
        <img
          src="assets/campaign-kids.png"
          alt="Campaña infantil con zapatillas Jordan"
        />
        <div class="hero-text">
          <p class="kicker">JORDAN GS / INVENTARIO</p>
          <h1>JUEGA<br /><em>FUERTE</em></h1>

        </div>
      </section>
      <div class="breadcrumb">INICIO / NIÑOS</div>
      <section class="shop-section" id="coleccion">
        <div class="title-row">
          <h1>SELECCIÓN GS</h1>
          <p>1 MODELO</p>
        </div>
        <div class="filter-bar">
          <button class="active" data-filter="all">TODO</button
          ><button data-filter="Air Jordan">AIR JORDAN</button>
        </div>
        <div class="product-grid" data-products="kids"></div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/i18n.js?v=20261117"></script>
